name: Build IPA

# Lets the backend match this run to the right job unambiguously instead of
# guessing by timestamp — see _find_github_run_id in the backend's tasks.py.
run-name: "ipa-build-${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "FrontendX job UUID (leave blank to run a smoke test with a dummy ID)"
        required: false
        default: "test-manual-run"
        type: string
      branch:
        description: "Branch containing project.zip"
        required: false
        default: "main"
        type: string
      runner_label:
        description: "Runner to build on: 'macos-26' for GitHub-hosted (default, billed per-minute), or a self-hosted runner's label (e.g. 'self-hosted' or a custom tag) if the user configured one — see AppleDeveloperCredential.runner_label in the backend."
        required: false
        default: "macos-26"
        type: string

# Certs/profiles now live per-user in our own backend (see
# fastlane/http_match_storage.rb), not one shared git repo, so builds for
# different users/jobs no longer race on a shared resource — only guard
# against the same job being dispatched twice concurrently.
concurrency:
  group: ios-build-ipa-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build:
    # Pinned to avoid silent environment changes when GitHub bumps macos-latest
    # to a new OS/Xcode image. Update deliberately alongside any Xcode-version-
    # sensitive changes (module map fixes, xcargs, etc.).
    #
    # Moved from macos-15 to macos-26: Apple now rejects App Store Connect
    # uploads built with anything older than the iOS 26 SDK (confirmed via a
    # real CI failure — altool 409 "This app was built with the iOS 18.4 SDK.
    # All iOS and iPadOS apps must be built with the iOS 26 SDK or later").
    # macos-15 never ships Xcode 26 (confirmed via GitHub's runner-images
    # docs/issues — excluded there on storage grounds), so macos-15 cannot
    # produce an accepted upload no matter which Xcode version is pinned.
    #
    # runs-on is user-configurable (see the runner_label input above) so a
    # user can point builds at their own Mac (self-hosted runner label)
    # instead of GitHub's billed-per-minute hosted macOS runners — "macos-26"
    # stays the default for anyone who hasn't configured one.
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 90

    steps:
      # These two provisioning steps only apply to GitHub's ephemeral hosted
      # image, which ships multiple Xcode versions side-by-side (needing an
      # explicit select) and without the iOS platform SDK predownloaded. A
      # self-hosted runner is the user's own persistent Mac — they're
      # responsible for having their desired Xcode + platform SDKs already
      # installed there; forcing setup-xcode's version-selection logic onto
      # an arbitrary self-hosted machine would just fail if that exact
      # version isn't present.
      #
      # Pinned to a tested Xcode version. When upgrading: bump here, verify the
      # CLANG_ENABLE_EXPLICIT_MODULES=NO xcargs still applies correctly, and
      # update this comment. macos-26 ships several Xcode 26.x builds side by
      # side (26.0.1 through 26.5+ as of this writing) — 26.2 pinned here as
      # the image's stated default rather than latest, since untested newer
      # points could introduce their own new build/xcargs behavior.
      - name: Select Xcode
        if: inputs.runner_label == 'macos-26'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      # `-runFirstLaunch` alone registers Xcode's platform/device metadata but
      # does NOT download a missing platform SDK — confirmed by a real run
      # that got past `-runFirstLaunch` and all the way through 73 targets of
      # compilation, only to fail at CompileStoryboard with "iOS 18.4 Platform
      # Not Installed." GitHub's macOS runner image ships Xcode 16.3 without
      # the iOS 18.4 platform bundle predownloaded, so it must be fetched with
      # `-downloadPlatform iOS`. A prior attempt at that command failed
      # immediately with exit 70 ("Unable to connect to simulator") — treated
      # as unusable at the time, but not yet proven to be a hard failure vs.
      # a transient one, since it was never retried. Retrying here to
      # distinguish the two; if this still fails after 3 attempts, the
      # command is confirmed unusable in this environment.
      - name: Install iOS platform support files
        if: inputs.runner_label == 'macos-26'
        run: |
          sudo xcodebuild -runFirstLaunch
          for i in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS && break
            echo "Retry $i failed, waiting..."
            sleep 15
          done
          xcodebuild -showsdks

      - name: Clean workspace from previous run
        run: |
          rm -rf project project.zip build
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      # Always check out main so the workflow uses the latest Fastfile/Gemfile.
      # project.zip lives on the build branch — we fetch just that file.
      - name: Checkout ipa-builder repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Extract project.zip from build branch
        # inputs.branch is always backend-generated ("build/<job-uuid>"), never
        # raw user text, but route it through env: rather than interpolating
        # ${{ }} directly into the script — that's the standard GitHub Actions
        # script-injection pattern, and this keeps the workflow safe even if
        # how `branch` is constructed ever changes.
        env:
          BUILD_BRANCH: ${{ inputs.branch }}
        run: |
          git fetch origin "$BUILD_BRANCH" 2>/dev/null || true
          if git ls-remote --exit-code origin "$BUILD_BRANCH" > /dev/null 2>&1; then
            git checkout "origin/$BUILD_BRANCH" -- project.zip signing_data.enc
          else
            echo "::warning::Branch '$BUILD_BRANCH' not found — no project.zip to extract. This is expected for a manual smoke test."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Unzip project
        if: env.SKIP_BUILD != 'true'
        run: |
          mkdir -p project
          unzip -q project.zip -d project

      # Copy Fastlane config files into the project directory so
      # `bundle exec fastlane` finds them when run from project/.
      - name: Copy Fastlane files into project
        if: env.SKIP_BUILD != 'true'
        run: |
          cp Gemfile project/Gemfile
          # Copy lock file so bundle install uses the exact pinned versions
          # rather than re-resolving from the Gemfile ranges on every run.
          [ -f Gemfile.lock ] && cp Gemfile.lock project/Gemfile.lock || true
          cp -r fastlane project/fastlane

      # Derive bundle ID and Xcode scheme from app.json so every generated
      # app gets its own unique identity without any manual secret management.
      - name: Derive bundle ID and scheme from app.json
        if: env.SKIP_BUILD != 'true'
        id: appinfo
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          APP_JSON="project/app.json"

          RAW_NAME=$(python3 -c "
          import json
          data = json.load(open('$APP_JSON'))
          name = data.get('expo', data).get('name', 'frontendxapp')
          print(name)
          ")

          # Prefer a bundle ID the project ALREADY has (project/app.json's
          # expo.ios.bundleIdentifier). This matters for GitHub-imported repos
          # that are already live on TestFlight under their own bundle ID: if
          # we minted a fresh job-scoped one instead, `produce` would try to
          # register a brand-new App Store Connect app using the SAME display
          # name the real app already owns — Apple rejects that as
          # APP_NAME_TAKEN, and even if it didn't, it would create a second
          # app instead of adding a build to the existing one.
          #
          # Only fall back to the synthetic com.frontendx.job-<job_id> ID when
          # the project has no bundle ID yet (a fresh, never-before-built app)
          # — job_id is fixed for a job's whole lifetime (initial generation,
          # restarts, every "Modify App" accept), so that fallback still keeps
          # hitting the same bundle ID / ASC app / TestFlight app across those.
          EXISTING_BUNDLE_ID=$(python3 -c "
          import json
          data = json.load(open('$APP_JSON'))
          root = data.get('expo', data)
          print(root.get('ios', {}).get('bundleIdentifier', '') or '')
          ")

          if [ -n "$EXISTING_BUNDLE_ID" ]; then
            BUNDLE_ID="$EXISTING_BUNDLE_ID"
            echo "Using existing bundle ID from app.json (imported/already-published app): $BUNDLE_ID"
          else
            SAFE_JOB_ID=$(echo "$JOB_ID" | tr -cd 'a-z0-9-')
            BUNDLE_ID="com.frontendx.job-${SAFE_JOB_ID}"
            echo "No existing bundle ID in app.json — minting a fresh one for this job: $BUNDLE_ID"
          fi

          echo "bundle_id=$BUNDLE_ID"   >> "$GITHUB_OUTPUT"
          echo "scheme=$RAW_NAME"       >> "$GITHUB_OUTPUT"

          echo "Derived bundle ID : $BUNDLE_ID"
          echo "Derived scheme    : $RAW_NAME"

      # Inject the generated bundle ID into app.json before expo prebuild
      # so the native Xcode project is generated with the correct identifier.
      - name: Patch app.json with derived bundle ID
        if: env.SKIP_BUILD != 'true'
        run: |
          python3 - <<'EOF'
          import json

          path = "project/app.json"
          with open(path) as f:
              data = json.load(f)

          bundle_id = "${{ steps.appinfo.outputs.bundle_id }}"

          root = data.get("expo", data)
          root.setdefault("ios", {})["bundleIdentifier"] = bundle_id
          root.setdefault("android", {})["package"] = bundle_id.replace("-", "_")

          with open(path, "w") as f:
              json.dump(data, f, indent=2)

          print(f"Patched bundleIdentifier → {bundle_id}")
          EOF

      # Decrypts the job owner's OWN Apple Developer / App Store Connect
      # credentials + any previously-stored signing bundle from
      # signing_data.enc — pushed alongside project.zip by the backend
      # (_push_signing_data_to_github in app/tasks.py), NOT fetched via any
      # live call back to the backend. IPA_SIGNING_ENCRYPTION_KEY must be set
      # identically here and as the backend's own IPA_SIGNING_ENCRYPTION_KEY
      # env var — it's the only thing shared between the two, and it never
      # travels over the network itself.
      - name: Decrypt Apple Developer credentials and signing bundle
        if: env.SKIP_BUILD != 'true'
        env:
          IPA_SIGNING_ENCRYPTION_KEY: ${{ secrets.IPA_SIGNING_ENCRYPTION_KEY }}
        run: |
          if [ -z "$IPA_SIGNING_ENCRYPTION_KEY" ]; then
            echo "::error::IPA_SIGNING_ENCRYPTION_KEY secret is empty. Set it to match the backend's IPA_SIGNING_ENCRYPTION_KEY env var exactly."
            exit 1
          fi
          if [ ! -f signing_data.enc ]; then
            echo "::error::signing_data.enc was not found on branch '${{ inputs.branch }}' — has the job's user configured Apple Developer credentials yet?"
            exit 1
          fi

          # `>> $GITHUB_ENV` only makes a var visible to LATER steps, not to
          # the rest of THIS step's own shell process — the python3 heredoc
          # below runs in this same step, so it also needs a plain `export`
          # to actually see SIGNING_BUNDLE_DIR (the $GITHUB_ENV write is what
          # makes it visible to the "Run Fastlane build_ipa"/"Package updated
          # signing bundle" steps that come after this one).
          #
          # Deliberately under $GITHUB_WORKSPACE, NOT $RUNNER_TEMP: a real run
          # confirmed match successfully created a cert here, but by the time
          # the final "Package updated signing bundle" step ran (~10min later,
          # after a long gym archive + upload_to_testflight), the whole
          # $RUNNER_TEMP/signing_bundle directory had vanished ("No such file
          # or directory") — GitHub-hosted macOS runners appear to reclaim
          # $RUNNER_TEMP disk space mid-job on long, disk-heavy builds.
          # $GITHUB_WORKSPACE is the persistent job checkout dir and isn't
          # subject to that same runner-managed cleanup.
          export SIGNING_BUNDLE_DIR="$GITHUB_WORKSPACE/.signing_bundle"
          echo "SIGNING_BUNDLE_DIR=$SIGNING_BUNDLE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SIGNING_BUNDLE_DIR"

          # macOS 26 runners ship a PEP 668 externally-managed system Python —
          # a bare `pip3 install` throws externally-managed-environment and,
          # since GitHub Actions runs steps under `bash -e`, aborts this step
          # immediately. --break-system-packages is safe here: this is a
          # short-lived CI runner VM, not a shared/persistent system.
          pip3 install --quiet --break-system-packages cryptography

          python3 - <<'PYEOF'
          import base64, hashlib, io, json, os, zipfile
          from cryptography.fernet import Fernet

          raw_key = os.environ["IPA_SIGNING_ENCRYPTION_KEY"]
          derived_key = base64.urlsafe_b64encode(hashlib.sha256(raw_key.encode()).digest())
          fernet = Fernet(derived_key)

          with open("signing_data.enc") as f:
              encrypted = f.read()
          data = json.loads(fernet.decrypt(encrypted.encode()).decode())

          masked_fields = [
              "apple_id", "apple_app_specific_password", "apple_team_id",
              "apple_company_name", "app_store_connect_key_id",
              "app_store_connect_issuer_id", "app_store_connect_api_key",
              "match_password", "fastlane_session",
          ]
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for field in masked_fields:
                  value = data.get(field) or ""
                  # GitHub's ::add-mask:: only recognizes a single-line token —
                  # a multi-line value (e.g. the ASC API key's .p8 contents)
                  # would otherwise only get its FIRST line masked, leaking
                  # every subsequent line into the log in plaintext. Mask each
                  # line of the value individually instead.
                  for line in value.splitlines():
                      if line:
                          print(f"::add-mask::{line}")
                  env_file.write(f"USER_{field.upper()}<<APPLE_CRED_EOF\n{value}\nAPPLE_CRED_EOF\n")

          # Where to send this runner's output so the member sees the build live in Xcore (scripts/stream_log.py). Only present when
          # the backend was asked to stream this run and its log service is reachable from here; absent, nothing is streamed.
          stream = data.get("log_stream") or {}
          stream_keys = ("url", "token", "org", "tool", "run", "attempt")
          if all(stream.get(k) not in (None, "") and len(str(stream[k]).splitlines()) == 1 for k in stream_keys):
              print(f"::add-mask::{stream['token']}")
              with open(os.environ["GITHUB_ENV"], "a") as env_file:
                  for key in stream_keys:
                      env_file.write(f"XLOG_{key.upper()}={stream[key]}\n")

          bundle_b64 = data.get("signing_bundle_base64")
          bundle_dir = os.environ["SIGNING_BUNDLE_DIR"]
          if bundle_b64:
              zip_bytes = base64.b64decode(bundle_b64)
              with zipfile.ZipFile(io.BytesIO(zip_bytes)) as zf:
                  zf.extractall(bundle_dir)
              print("Extracted existing signing bundle into", bundle_dir)
          else:
              print("No existing signing bundle for this user — match will create fresh certs/profiles.")
          PYEOF

          rm -f signing_data.enc

      # Register the bundle ID via ASC REST API (idempotent).
      # App Store Connect app creation is handled by `produce` in the Fastlane
      # build_ipa lane — the REST API forbids POST /v1/apps for standard accounts.
      - name: Register bundle ID
        if: env.SKIP_BUILD != 'true'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ env.USER_APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ env.USER_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ env.USER_APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_ID: ${{ steps.appinfo.outputs.bundle_id }}
          XCODE_SCHEME: ${{ steps.appinfo.outputs.scheme }}
        run: |
          ruby - <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'uri'
          require 'time'

          key_id    = ENV['APP_STORE_CONNECT_KEY_ID']
          issuer_id = ENV['APP_STORE_CONNECT_ISSUER_ID']
          bundle_id = ENV['APP_BUNDLE_ID']
          app_name  = ENV['XCODE_SCHEME']

          private_key = OpenSSL::PKey::EC.new(ENV['APP_STORE_CONNECT_API_KEY'])

          def make_jwt(private_key, key_id, issuer_id)
            header  = Base64.urlsafe_encode64({ alg: 'ES256', kid: key_id, typ: 'JWT' }.to_json).tr('=', '')
            now     = Time.now.to_i
            payload = Base64.urlsafe_encode64({ iss: issuer_id, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }.to_json).tr('=', '')
            signing_input = "#{header}.#{payload}"
            der = private_key.sign(OpenSSL::Digest::SHA256.new, signing_input)
            asn = OpenSSL::ASN1.decode(der)
            r   = asn.value[0].value.to_s(2).rjust(32, "\x00")[-32..]
            s   = asn.value[1].value.to_s(2).rjust(32, "\x00")[-32..]
            "#{signing_input}.#{Base64.urlsafe_encode64(r + s).tr('=', '')}"
          end

          http = Net::HTTP.new('api.appstoreconnect.apple.com', 443)
          http.use_ssl = true

          def headers(token)
            { 'Authorization' => "Bearer #{token}", 'Content-Type' => 'application/json' }
          end

          # Register bundle ID (idempotent — 409 means already exists)
          token = make_jwt(private_key, key_id, issuer_id)
          req = Net::HTTP::Post.new('/v1/bundleIds', headers(token))
          req.body = {
            data: {
              type: 'bundleIds',
              attributes: { identifier: bundle_id, name: app_name, platform: 'IOS' }
            }
          }.to_json
          resp = http.request(req)
          if resp.code == '409'
            puts "Bundle ID #{bundle_id} already registered."
          elsif resp.code.start_with?('2')
            puts "Registered bundle ID #{bundle_id}."
          else
            puts "ERROR registering bundle ID (#{resp.code}): #{resp.body}"
            exit 1
          end

          # App Store *display names* are globally unique, but the bundle ID
          # stored in app.json can drift from what the app is ACTUALLY
          # registered under in App Store Connect (imported/already-published
          # repos rebuilt across pipeline versions, hand-edited app.json,
          # etc.). If we proceed with a drifted bundle ID, `produce` in the
          # Fastlane lane later hard-fails with APP_NAME_TAKEN trying to
          # create a second app with the same name — when the real intent is
          # "add a build to the app that already owns this name."
          #
          # Look up ASC by NAME (ground truth for "does this app already
          # exist") and, if found under a DIFFERENT bundle ID than the one we
          # derived, adopt that bundle ID for the rest of this build — patch
          # app.json now, before expo prebuild bakes the wrong identifier
          # into the native Xcode project, and export it so every later step
          # (Fastlane, etc.) uses the corrected value instead of the
          # possibly-stale steps.appinfo.outputs.bundle_id.
          #
          # No-op for fresh/never-before-built apps: no ASC app exists yet
          # under this name, so `match` stays nil and resolved_bundle_id
          # stays equal to the derived bundle_id — behavior is unchanged.
          resolved_bundle_id = bundle_id
          token = make_jwt(private_key, key_id, issuer_id)
          encoded_name = URI.encode_www_form_component(app_name)
          lookup_req = Net::HTTP::Get.new("/v1/apps?filter[name]=#{encoded_name}", headers(token))
          lookup_resp = http.request(lookup_req)

          if lookup_resp.code.start_with?('2')
            found = JSON.parse(lookup_resp.body)['data'] || []
            match = found.find { |app| app.dig('attributes', 'bundleId') && app.dig('attributes', 'bundleId') != bundle_id }
            if match
              resolved_bundle_id = match['attributes']['bundleId']
              puts "::warning::App named '#{app_name}' already exists in App Store Connect under bundle ID " \
                   "#{resolved_bundle_id} (derived bundle ID was #{bundle_id} — app.json's stored value had " \
                   "drifted). Rebuilding against the existing app's real bundle ID instead of creating a duplicate."
            end
          else
            puts "Could not look up App Store Connect apps by name (#{lookup_resp.code}) — proceeding with derived bundle ID #{bundle_id}."
          end

          if resolved_bundle_id != bundle_id
            app_json_path = 'project/app.json'
            data = JSON.parse(File.read(app_json_path))
            root = data['expo'] || data
            root['ios'] ||= {}
            root['ios']['bundleIdentifier'] = resolved_bundle_id
            root['android'] ||= {}
            root['android']['package'] = resolved_bundle_id.gsub('-', '_')
            File.write(app_json_path, JSON.pretty_generate(data))
            puts "Re-patched app.json bundleIdentifier -> #{resolved_bundle_id}"
          end

          File.open(ENV['GITHUB_ENV'], 'a') { |f| f.puts "RESOLVED_BUNDLE_ID=#{resolved_bundle_id}" }
          RUBY

      - name: Setup Node.js
        if: env.SKIP_BUILD != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        if: env.SKIP_BUILD != 'true'
        working-directory: project
        run: bash "$GITHUB_WORKSPACE/scripts/run_streamed.sh" npm install

      - name: Expo prebuild (generate native iOS project)
        if: env.SKIP_BUILD != 'true'
        working-directory: project
        # --no-install skips the pod install that expo prebuild runs internally.
        # We patch the Podfile in the Fastlane lane first (strip legacy
        # withExplicitModules post_install block, inject use_frameworks!) before
        # running pod install ourselves — if prebuild runs pod install here it
        # sees the duplicate post_install block and hard-fails before we can fix it.
        run: bash "$GITHUB_WORKSPACE/scripts/run_streamed.sh" npx expo prebuild --clean --platform ios --no-install

      # Detect the actual Xcode scheme from the generated project.
      # The scheme file name is the source of truth — safer than relying on
      # app.json name which may be normalized differently by expo prebuild.
      - name: Detect Xcode scheme
        if: env.SKIP_BUILD != 'true'
        id: scheme
        env:
          RAW_NAME: ${{ steps.appinfo.outputs.scheme }}
        run: |
          # Exclude ios/Pods/** — CocoaPods generates a .xcscheme per installed
          # pod alongside the app scheme; find's order is non-deterministic so
          # filtering is required to avoid picking the wrong scheme.
          # Note: mapfile is not used — macOS ships Bash 3.2 which lacks it.
          SCHEME_FILE_LIST=$(find project/ios -name "*.xcscheme" -not -path "*/Pods/*" 2>/dev/null || true)
          COUNT=$(echo "$SCHEME_FILE_LIST" | grep -c '[^[:space:]]' || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "No .xcscheme found — falling back to app.json name"
            SCHEME="$RAW_NAME"
          elif [ "$COUNT" -eq 1 ]; then
            SCHEME=$(basename "$SCHEME_FILE_LIST" .xcscheme)
          else
            # Multiple schemes: prefer one whose filename matches the sanitized app name
            SAFE=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
            MATCH=$(echo "$SCHEME_FILE_LIST" | while IFS= read -r f; do
              [ -z "$f" ] && continue
              base=$(basename "$f" .xcscheme)
              base_lower=$(echo "$base" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
              if [ "$base_lower" = "$SAFE" ]; then echo "$base"; break; fi
            done)
            if [ -n "$MATCH" ]; then
              SCHEME="$MATCH"
            else
              SCHEME=$(echo "$SCHEME_FILE_LIST" | xargs -I{} basename {} .xcscheme | sort | head -1)
              echo "::warning::Multiple schemes found — picked '$SCHEME'. Verify this is the app target."
            fi
          fi

          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected scheme: $SCHEME"

      - name: List ios directory (debug)
        if: env.SKIP_BUILD != 'true'
        run: find project/ios -maxdepth 3 -name "*.xcworkspace" -o -name "*.xcodeproj" | head -20

      # bundler-cache is off because the current Gemfile.lock was generated with
      # an older Bundler that omitted CHECKSUMS — Bundler 4.x rejects it in
      # frozen/deployment mode with exit 16. Re-run the generate-lockfile
      # workflow (which now uses Bundler 4.x) to regenerate Gemfile.lock with
      # checksums, then flip bundler-cache back to true.
      - name: Setup Ruby + Bundler
        if: env.SKIP_BUILD != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
          working-directory: project

      - name: Install gems
        if: env.SKIP_BUILD != 'true'
        working-directory: project
        run: |
          bundle config set frozen false
          bundle install --jobs 4 --retry 3

      # Fast-fail before Fastlane if FASTLANE_SESSION is missing or expired.
      # Apple session tokens last ~30 days; when expired Spaceship falls back
      # to an interactive 2FA prompt that never resolves on a CI runner,
      # silently consuming the entire 45-minute Fastlane timeout.
      # Regenerate with: fastlane spaceauth -u your@apple.id
      - name: Check FASTLANE_SESSION validity
        if: env.SKIP_BUILD != 'true'
        env:
          FASTLANE_SESSION: ${{ env.USER_FASTLANE_SESSION }}
        run: |
          if [ -z "$FASTLANE_SESSION" ]; then
            echo "::error::This user has not configured a Fastlane session. They must run 'fastlane spaceauth -u your@apple.id' and save the output in Apple Developer Settings."
            exit 1
          fi
          EXPIRY=$(echo "$FASTLANE_SESSION" | python3 -c "
          import sys, re
          content = sys.stdin.read()
          match = re.search(r'expires:\s*(\d{4}-\d{2}-\d{2})', content)
          print(match.group(1) if match else 'unknown')
          ")
          if [ "$EXPIRY" = "unknown" ]; then
            echo "::notice::Could not parse FASTLANE_SESSION expiry — this is normal when session cookies carry no expiry date. Session is valid if regenerated within the last 30 days."
          else
            TODAY=$(date -u +%Y-%m-%d)
            if [[ "$EXPIRY" < "$TODAY" ]]; then
              echo "::error::FASTLANE_SESSION expired on $EXPIRY (today is $TODAY). Regenerate with: fastlane spaceauth -u your@apple.id"
              exit 1
            fi
            echo "FASTLANE_SESSION valid until $EXPIRY"
          fi

      # Fast-fail if the app-specific password is missing before Fastlane runs.
      # `produce` calls Spaceship web auth with this credential; an empty value
      # causes Spaceship to prompt for a password interactively, which never
      # resolves on a CI runner and silently consumes the 45-minute Fastlane timeout.
      # Generate at: appleid.apple.com → Sign-In and Security → App-Specific Passwords.
      - name: Check APPLE_APP_SPECIFIC_PASSWORD is set
        if: env.SKIP_BUILD != 'true'
        env:
          FASTLANE_PASSWORD: ${{ env.USER_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$FASTLANE_PASSWORD" ]; then
            echo "::error::This user has not configured an app-specific password. Generate one at appleid.apple.com → Sign-In and Security → App-Specific Passwords and save it in Apple Developer Settings."
            exit 1
          fi
          echo "APPLE_APP_SPECIFIC_PASSWORD is set."

      - name: Run Fastlane build_ipa
        if: env.SKIP_BUILD != 'true'
        working-directory: project
        # Timeout guards against any residual interactive prompts that slip
        # past the session check above (e.g. an unexpected 2FA challenge mid-lane).
        timeout-minutes: 45
        env:
          # SIGNING_BUNDLE_DIR is already ambient from the "Decrypt Apple
          # Developer credentials and signing bundle" step above (exported
          # via $GITHUB_ENV) — Match::Storage::LocalDirStorage reads it
          # directly, no HTTP/network calls to our backend at all.
          MATCH_KEYCHAIN_NAME: "fastlane_match_keychain"
          # Per-user Apple Developer identity — decrypted locally from
          # signing_data.enc by the step above, masked in logs.
          MATCH_PASSWORD: ${{ env.USER_MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ env.USER_MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.USER_APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ env.USER_APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_FILEPATH: /tmp/authkey.p8
          APP_STORE_CONNECT_ISSUER_ID: ${{ env.USER_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ env.USER_APP_STORE_CONNECT_KEY_ID }}
          APPLE_ID: ${{ env.USER_APPLE_ID }}
          APPLE_COMPANY_NAME: ${{ env.USER_APPLE_COMPANY_NAME }}
          FASTLANE_USER: ${{ env.USER_APPLE_ID }}
          FASTLANE_SESSION: ${{ env.USER_FASTLANE_SESSION }}
          FASTLANE_PASSWORD: ${{ env.USER_APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ env.USER_APPLE_APP_SPECIFIC_PASSWORD }}
          # Auto-derived per app — not stored as secrets. RESOLVED_BUNDLE_ID
          # (set by "Register bundle ID") is the derived bundle ID unless ASC
          # already has this app name under a different one, in which case
          # it's that real bundle ID instead — see the reconciliation logic
          # in that step.
          APP_BUNDLE_ID: ${{ env.RESOLVED_BUNDLE_ID }}
          XCODE_SCHEME: ${{ steps.scheme.outputs.name }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > /tmp/authkey.p8
          # Same command, its output also streamed live to the member's log in Xcore when the run has a log stream (see the
          # decrypt step); run_streamed.sh keeps fastlane's own exit code.
          bash "$GITHUB_WORKSPACE/scripts/run_streamed.sh" bundle exec fastlane ios build_ipa

      # Re-zips+encrypts SIGNING_BUNDLE_DIR (possibly containing new/renewed
      # certs `match` just created) and uploads it as a build artifact so
      # poll_ipa_build_task can pull it back and persist it for this user's
      # NEXT build — otherwise every build would recreate certs from
      # scratch and quickly hit Apple's 2-distribution-cert-per-team limit.
      # Runs even if the Fastlane step itself failed partway through (e.g.
      # after match already created a cert but gym/upload later failed) so
      # that work isn't silently lost.
      - name: Package updated signing bundle
        if: always() && env.SKIP_BUILD != 'true'
        env:
          IPA_SIGNING_ENCRYPTION_KEY: ${{ secrets.IPA_SIGNING_ENCRYPTION_KEY }}
        run: |
          echo "SIGNING_BUNDLE_DIR contents before packaging:"
          find "$SIGNING_BUNDLE_DIR" -type f -exec ls -la {} \; || echo "(SIGNING_BUNDLE_DIR not found or empty)"

          python3 - <<'PYEOF'
          import base64, hashlib, io, json, os, zipfile
          from cryptography.fernet import Fernet

          bundle_dir = os.environ["SIGNING_BUNDLE_DIR"]
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, _dirs, files in os.walk(bundle_dir):
                  for name in files:
                      path = os.path.join(root, name)
                      zf.write(path, os.path.relpath(path, bundle_dir))
          bundle_b64 = base64.b64encode(buf.getvalue()).decode()

          raw_key = os.environ["IPA_SIGNING_ENCRYPTION_KEY"]
          derived_key = base64.urlsafe_b64encode(hashlib.sha256(raw_key.encode()).digest())
          fernet = Fernet(derived_key)
          encrypted = fernet.encrypt(json.dumps({"signing_bundle_base64": bundle_b64}).encode()).decode()

          with open("signing_bundle.enc", "w") as f:
              f.write(encrypted)
          PYEOF

      - name: Upload updated signing bundle artifact
        if: always() && env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-bundle-${{ inputs.job_id }}
          path: signing_bundle.enc
          retention-days: 7
          if-no-files-found: error

      - name: Upload IPA artifact
        id: upload_artifact
        if: success() && env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-${{ inputs.job_id }}
          path: project/build/app.ipa
          retention-days: 7
          # error (not warn) so the step fails when gym exits 0 but produces no
          # IPA — prevents the backend from marking the job "completed" while
          # there is no actual file to download.
          if-no-files-found: error

      # gym's own log (the one "see the log above" points at) only ever lived
      # in the runner's scrollback otherwise — every prior failure required
      # scrolling/pasting Actions UI output by hand to see the actual
      # xcodebuild error. Upload it as a downloadable artifact instead.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.job_id }}
          path: |
            /Users/runner/Library/Logs/gym/*.log
            /tmp/priming_build.log
            /tmp/pod_install.log
            project/ios/Podfile
          if-no-files-found: ignore
          retention-days: 7

      # No callback step needed — the backend polls GitHub Actions API directly.
